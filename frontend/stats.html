<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Stats | FuelWell</title>
  <link rel="stylesheet" href="/styles/styles.css" />
  <style>
    .st-main { max-width: 760px; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-6); }
    .st-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); }
    .st-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: var(--space-3); }
    .st-tile { padding: var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
    .st-tile--key { background: var(--primary-soft); border-color: transparent; }
    .st-label { margin: 0; font-weight: 700; color: var(--ink-2); }
    .st-num { margin: 4px 0 0; font-size: 2.6rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .st-sub { margin: 4px 0 0; color: var(--ink-3); font-size: var(--text-sm); }
    .st-note { margin-top: var(--space-5); color: var(--ink-3); font-size: var(--text-sm); }
  </style>
  <script type="module" src="/scripts/stats.js"></script>
</head>
<body>
  <main class="st-main">
    <div class="st-head">
      <a class="brand" href="/" aria-label="FuelWell home"><span class="brand-mark" aria-hidden="true"></span>FuelWell</a>
      <button class="button button--secondary" type="button" id="refresh">Refresh</button>
    </div>
    <h1>Demo numbers</h1>
    <p class="muted" id="status" role="status">Loading…</p>
    <ul class="st-grid" id="tiles"></ul>
    <p class="st-note">Counted since Nov 1, 2026. “People” means different phones or browsers (no names or emails are stored). “Today” is Pacific time. Updates every 30 seconds.</p>
  </main>
</body>
</html>
