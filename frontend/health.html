<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Mom’s kidney lab trends and results, explained in plain language." />
    <title>Health & labs | FuelWell</title>
    <link rel="stylesheet" href="/styles/styles.css" />
    <link rel="stylesheet" href="/styles/dashboard.css" />
    <script type="module" src="/scripts/app-health.js"></script>
    <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body class="app-page is-loading">
    <a class="skip-link" href="#main-content" data-i18n="skip">Skip to content</a>
    <div class="app-loader" data-app-loader role="status" aria-live="polite">
      <span class="sr-only" data-i18n="loading">Loading…</span>
      <div class="sk-rail" aria-hidden="true"><div class="sk sk-logo"></div><div class="sk sk-nav"></div><div class="sk sk-nav"></div><div class="sk sk-nav"></div><div class="sk sk-nav"></div></div>
      <div class="sk-body" aria-hidden="true">
        <div class="sk sk-top"></div>
        <div class="sk sk-title"></div>
        <div class="sk sk-line"></div>
        <div class="sk-grid"><div class="sk sk-tile"></div><div class="sk sk-tile"></div><div class="sk sk-tile"></div><div class="sk sk-tile"></div></div>
        <div class="sk-grid sk-grid--2"><div class="sk sk-card"></div><div class="sk sk-card"></div></div>
      </div>
    </div>
    <div class="app-frame" data-app-frame hidden>
      <main class="app-main" id="main-content" tabindex="-1">
        <div class="page-head">
          <div>
            <h1 data-i18n="health_h1">Health &amp; labs</h1>
            <p class="page-sub" data-i18n="health_sub"></p>
          </div>
        </div>
        <div class="subtabs" role="tablist" data-i18n-aria="health_sections">
          <button class="subtab" type="button" role="tab" id="tab-trends" data-tab="trends" aria-controls="panel-trends" aria-selected="false" tabindex="-1"><span data-icon="chart"></span><span data-i18n="tab_trends">Trends</span></button>
          <button class="subtab" type="button" role="tab" id="tab-labs" data-tab="labs" aria-controls="panel-labs" aria-selected="false" tabindex="-1"><span data-icon="table"></span><span data-i18n="tab_labs">Lab results</span></button>
        </div>
        <section class="tabpanel" role="tabpanel" id="panel-trends" aria-labelledby="tab-trends" tabindex="0" hidden>
          <div class="chart-grid" data-charts></div>
          <div class="meaning-grid">
            <section class="card card--tint meaning" aria-labelledby="meaning-title">
              <h2 id="meaning-title" data-i18n="meaning_h2">What these numbers mean</h2>
              <ul class="meaning-list">
                <li data-i18n-html="meaning_egfr"></li>
                <li data-i18n-html="meaning_k"></li>
                <li data-i18n-html="meaning_p"></li>
              </ul>
            </section>
            <aside class="notice talk-note">
              <span data-icon="info"></span>
              <p><strong data-i18n="talk_title">Talk to your care team.</strong> <span data-i18n="talk_body"></span></p>
            </aside>
          </div>
        </section>
        <section class="tabpanel" role="tabpanel" id="panel-labs" aria-labelledby="tab-labs" tabindex="0" hidden>
          <section class="card" aria-labelledby="labs-title">
            <div class="panel-title"><h2 id="labs-title" data-i18n="labs_h2">Latest lab results</h2><span class="chip" data-lab-date></span></div>
            <div class="table-wrap">
              <table class="data-table lab-table">
                <caption class="sr-only" data-i18n="labs_caption"></caption>
                <thead><tr><th scope="col" data-i18n="col_test">Test</th><th scope="col" data-i18n="col_result">Result</th><th scope="col" data-i18n="col_range">Typical range</th><th scope="col" data-i18n="col_status">Status</th><th scope="col" data-i18n="col_date">Date</th></tr></thead>
                <tbody data-lab-rows></tbody>
              </table>
            </div>
            <p class="notice talk-note"><span data-icon="info"></span><span data-i18n="labs_note"></span></p>
          </section>
        </section>
      </main>
    </div>
    <div class="toast" role="status" aria-live="polite" aria-atomic="true" data-toast></div>
  </body>
</html>
