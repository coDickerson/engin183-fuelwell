<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Today’s nutrition, meals and care-team updates for Mom in FuelWell." />
    <title>Today | FuelWell</title>
    <link rel="stylesheet" href="/styles/styles.css" />
    <link rel="stylesheet" href="/styles/dashboard.css" />
    <script type="module" src="/scripts/dashboard.js"></script>
    <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body class="app-page is-loading">
    <a class="skip-link" href="#main-content" data-i18n="skip">Skip to content</a>
    <div class="app-loader" data-app-loader role="status" aria-live="polite">
      <span class="sr-only" data-i18n="loading">Loading…</span>
      <div class="sk-rail" aria-hidden="true"><div class="sk sk-logo"></div><div class="sk sk-nav"></div><div class="sk sk-nav"></div><div class="sk sk-nav"></div><div class="sk sk-nav"></div></div>
      <div class="sk-body" aria-hidden="true">
        <div class="sk sk-top"></div>
        <div class="sk sk-title"></div>
        <div class="sk sk-line"></div>
        <div class="sk-grid"><div class="sk sk-tile"></div><div class="sk sk-tile"></div><div class="sk sk-tile"></div><div class="sk sk-tile"></div></div>
        <div class="sk-grid sk-grid--2"><div class="sk sk-card"></div><div class="sk sk-card"></div></div>
      </div>
    </div>
    <div class="app-frame" data-app-frame hidden>
      <main class="app-main" id="main-content" tabindex="-1">
        <div class="page-head">
          <div>
            <p class="eyebrow" data-today-date></p>
            <h1 data-greeting></h1>
            <p class="page-sub" data-i18n="today_sub">Here’s Mom’s day at a glance.</p>
          </div>
          <div class="page-head-meta" data-patient-meta></div>
        </div>
        <section class="kpi-section" aria-labelledby="kpi-title">
          <div class="section-head"><h2 id="kpi-title" data-i18n="nutrients_title">Today’s nutrients</h2><p class="muted" data-i18n="nutrients_sub"></p></div>
          <div class="kpi-grid" data-kpis></div>
        </section>
        <div class="today-grid">
          <div class="today-left">
          <section class="card today-meals" aria-labelledby="meals-title">
            <div class="panel-title"><h2 id="meals-title" data-i18n="meals_today">Mom’s meals today</h2><a class="link-arrow" href="/meals.html#week"><span data-i18n="see_week">See the week</span> <span data-icon="arrow"></span></a></div>
            <ol class="meal-list" data-today-meals></ol>
          </section>
          <section class="card card--tint next-step" aria-labelledby="next-title" data-next-step></section>
          </div>
          <div class="today-side">
            <section class="card profile-card" aria-labelledby="profile-title" data-profile hidden></section>
            <section class="card dietitian-card" aria-labelledby="dt-title" data-dietitian></section>
            <section class="card appt-card" aria-labelledby="appt-title" data-next-appt></section>
          </div>
        </div>
      </main>
    </div>
    <div class="toast" role="status" aria-live="polite" aria-atomic="true" data-toast></div>
  </body>
</html>
